name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'      # nightly at 11:30 PM IST (cron is in UTC)
  workflow_dispatch:          # lets you start a run by hand from the Actions tab
    inputs:
      project:
        description: 'UI browser project'
        default: 'chromium'
        type: choice
        options: [chromium, firefox, webkit]
      grep:
        description: 'Tag or text to run, e.g. @smoke (empty = everything)'

permissions:
  contents: read

# cancel an older run on the same branch when a new one starts
# (event name keeps a push from cancelling the nightly run, and vice versa)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: true
  ENV_NAME: SIT
  # push / PR → smoke only · nightly → everything · manual → grep input (empty = everything)
  GREP: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '@smoke' || inputs.grep }}

jobs:
  ui-tests:
    runs-on: ubuntu-latest   #windows-latest  #macos-latest
    timeout-minutes: 60
    env:
      PROJECT: ${{ inputs.project || 'chromium' }}
      BASE_URL: ${{ secrets.BASE_URL }}
      USER_NAME: ${{ secrets.USER_NAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*   #Long term support
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps "$PROJECT"

      - name: Generate test data
        run: npm run data:new-joiners

      - name: Run UI tests
        run: npx playwright test --project="$PROJECT" ${GREP:+--grep "$GREP"}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, videos, JUnit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/
          retention-days: 14

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: allure-results/
          retention-days: 14

  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*   #Long term support
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npx playwright test --project=apiTest ${GREP:+--grep "$GREP"}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (JUnit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/
          retention-days: 14

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: allure-results/
          retention-days: 14
