name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # lets you start a run by hand from the Actions tab
    inputs:
      project:
        description: 'Playwright project'
        default: 'chromium'
        type: choice
        options: [chromium, firefox, webkit, apiTest]

jobs:
  test:
    runs-on: ubuntu-latest   #windows-latest
    timeout-minutes: 60
    env:
      CI: true
      ENV_NAME: SIT
      BASE_URL: ${{ secrets.BASE_URL }}
      USER_NAME: ${{ secrets.USER_NAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      API_USERNAME: ${{ secrets.API_USERNAME }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*   #Long term support
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate test data
        run: npm run data:new-joiners

      - name: Run tests
        run: npx playwright test --project=${{ inputs.project || 'chromium' }} --workers=3

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: test-results/junit/results.xml
          retention-days: 14

          